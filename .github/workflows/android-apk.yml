name: Build Android release APK

on:
  workflow_dispatch:
  pull_request:
    branches:
      - master
    paths:
      - '.github/workflows/android-apk.yml'
      - 'TMessagesProj/**'
      - 'TMessagesProj_App/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - 'gradle/**'

permissions:
  contents: read

concurrency:
  group: android-release-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: arm64 release APK
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      CCACHE_COMPILERCHECK: '%compiler% -dumpmachine; %compiler% -dumpversion'
      CCACHE_NOHASHDIR: 'true'
      CCACHE_MAXSIZE: 10G
      CCACHE_HARDLINK: 'true'

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y bison gcc make curl ninja-build ccache
          yes | sdkmanager --install 'ndk;27.2.12479018' --sdk_root="${ANDROID_SDK_ROOT}" >/dev/null
          {
            printf 'sdk.dir=%s\n' "${ANDROID_HOME}"
            printf 'RELEASE_STORE_PASSWORD=android\n'
            printf 'RELEASE_KEY_ALIAS=androidkey\n'
            printf 'RELEASE_KEY_PASSWORD=android\n'
          } > local.properties

      - name: Build arm64 release APK
        run: ./gradlew :TMessagesProj_App:assembleAfatRelease --build-cache --no-configuration-cache

      - name: Collect APK
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import shutil

          roots = [
              Path('TMessagesProj_App/build/outputs/apk'),
              Path('TMessagesProj_App/build/outputs'),
          ]
          apks = []
          for root in roots:
              if root.exists():
                  apks.extend(root.rglob('*.apk'))
          apks = sorted({p.resolve() for p in apks if p.is_file()})
          if not apks:
              raise SystemExit('no APK produced')
          if len(apks) != 1:
              print('candidates:', apks)
          src = apks[0]
          out = Path('artifacts/Telegram-Opt-arm64-release.apk')
          out.parent.mkdir(parents=True, exist_ok=True)
          shutil.copy2(src, out)
          print(f'Collected {src} -> {out} ({out.stat().st_size} bytes)')
          PY

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Telegram-Opt-arm64-release
          path: artifacts/Telegram-Opt-arm64-release.apk
          if-no-files-found: error
          retention-days: 30
